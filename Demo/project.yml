name: FTPlayerDemo
options:
  deploymentTarget:
    iOS: "13.0"
projectReferences:
  FTPlayerSDK:
    path: ../SDK/FTPlayer.xcodeproj
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
targets:
  FTPlayerDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftplayer.demo
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - target: FTPlayerSDK/FTPlayer
        embed: true
schemes:
  FTPlayerDemo:
    build:
      targets:
        FTPlayerSDK/FTPlayer: all
        FTPlayerDemo: all
    run:
      config: Debug
      executable: FTPlayerDemo
