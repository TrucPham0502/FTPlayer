 \"${WORK_DIR}/${PRODUCT_NAME}.xcframework\" \"${XCFRAMEWORK_OUTPUT}\"\necho \"Created XCFramework (${SLICE_COUNT} platform slices): ${XCFRAMEWORK_OUTPUT}\"\n";
